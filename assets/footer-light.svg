<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Automatisons votre prochain process"><title>Automatisons votre prochain process</title>
<style>
  .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;}
  .mono{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}
  .t{fill:#141A21;} .m{fill:#5A6674;} .a{fill:#3E8C00;} .a2{fill:#0083B8;}
  
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;} }
</style>
<defs><clipPath id="fc"><rect x="1" y="1" width="998" height="168" rx="20"/></clipPath></defs>
<rect x="1" y="1" width="998" height="168" rx="20" fill="#FFFFFF" stroke="#D5DDE5"/>
<g clip-path="url(#fc)">
  <path d="M0 128 Q 125 114 250 128 Q 375 142 500 128 Q 625 114 750 128 Q 875 142 1000 128 Q 1125 114 1250 128 Q 1375 142 1500 128 Q 1625 114 1750 128 Q 1875 142 2000 128 V170 H0 Z" fill="#0083B8" opacity="0.12"><animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="9s" repeatCount="indefinite"/></path>
  <path d="M0 140 Q 125 130 250 140 Q 375 150 500 140 Q 625 130 750 140 Q 875 150 1000 140 Q 1125 130 1250 140 Q 1375 150 1500 140 Q 1625 130 1750 140 Q 1875 150 2000 140 V170 H0 Z" fill="#3E8C00" opacity="0.18"><animateTransform attributeName="transform" type="translate" values="-500 0;0 0" dur="6s" repeatCount="indefinite"/></path>
</g>
<text x="500.0" y="64" text-anchor="middle" class="sans t" font-size="25" font-weight="750">Votre prochain process automatisé commence ici.</text>
<text x="500.0" y="96" text-anchor="middle" class="mono m" font-size="13.5">moins de saisie · moins d'oublis · plus de temps pour l'essentiel</text>
