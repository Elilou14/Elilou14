<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="EXOLIANCE — Automatisations &amp; outils sur mesure"><title>EXOLIANCE — Automatisations &amp; outils sur mesure</title>
<style>
  .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;}
  .mono{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}
  .t{fill:#E8EEF5;} .m{fill:#7C8896;} .a{fill:#B8FF3C;} .a2{fill:#3CE3FF;}
  
  .word{opacity:0; animation:rot 12s infinite both; transform-box:fill-box;}
  @keyframes rot{
    0%{opacity:0; transform:translateY(14px);}
    3.00%{opacity:1; transform:translateY(0);}
    21.25%{opacity:1; transform:translateY(0);}
    24.50%{opacity:0; transform:translateY(-14px);}
    100%{opacity:0; transform:translateY(-14px);}
  }
  .log{opacity:0; animation:log 8s infinite both;}
  @keyframes log{ 0%{opacity:0;} 4%{opacity:1;} 80%{opacity:1;} 90%{opacity:0;} 100%{opacity:0;} }
  .blink{animation:blink 1s steps(1) infinite;}
  @keyframes blink{ 50%{opacity:0;} }

  @media (prefers-reduced-motion: reduce){ *{animation:none!important;} }
</style>
